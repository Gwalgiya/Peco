<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>一个小入口 · Peco</title>
<style>
:root{color-scheme:light;--ink:#24352c;--muted:#6e7b72;--line:#dce4dd;--paper:#fff;--bg:#f5f7f2;--green:#416b54;--soft:#eaf1e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{width:min(1040px,calc(100% - 48px));margin:40px auto 32px}h1,h2,h3,p,dl,dd{margin:0}h1{font-size:clamp(27px,4vw,40px);font-weight:650;line-height:1.3;letter-spacing:-.03em}h2{font-size:19px;line-height:1.4}h3{font-size:18px;line-height:1.45}
h1,h2,h3,p,dd,span,li{overflow-wrap:anywhere;word-break:normal}header{margin-bottom:28px}.brand{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;color:var(--green);font-weight:650;margin-bottom:16px}.brand svg{flex:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:14px}.meta span:last-child{color:var(--green)}.intro{max-width:64ch;margin-top:16px;color:var(--muted)}section{margin-top:24px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-title>span{font-size:12px;color:var(--muted)}
.card,.focus-card{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:24px;min-width:0;break-inside:avoid}.focus-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}.focus-card h3{margin:12px 0 16px}.number{font-size:13px;letter-spacing:.12em;color:var(--green)}dl{display:grid;gap:10px}dt{font-size:11px;color:var(--muted)}dd{font-size:14px}
.timeline{list-style:none;margin:0;padding:6px 24px}.timeline li{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;align-items:start;padding:20px 0;border-top:1px solid var(--line)}.timeline li:first-child{border-top:none}.time{font-size:14px;color:var(--muted);padding-top:2px}.slot h3{font-size:16px}.slot p{font-size:13px;color:var(--muted);margin-top:5px}.tag{font-size:11px;white-space:nowrap;align-self:start;padding:3px 9px;border-radius:20px;background:#eef2ef;color:#526a59}.fuel{background:#fbf2df;color:#8a6b38}.fixed{background:#edf0f4;color:#667083}.buffer{background:#f1eeea;color:#7c7163}
.now{background:var(--soft);border-color:#d4e2d2}.task-name{color:var(--muted);font-size:14px;margin-top:12px}.action-text{font-size:clamp(20px,3vw,28px);line-height:1.55;margin-top:10px;font-weight:550}.stop{font-size:14px;margin-top:20px;padding-top:16px;border-top:1px solid #cfdecd}.stop span,.return-note>span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.empty{color:var(--muted);font-size:14px;margin:0;padding:12px 0}.flow{width:100%;height:auto;display:block;margin:20px 0 8px}.flow text{font-family:inherit;font-size:14px;fill:var(--muted)}footer{margin-top:28px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}.single{max-width:740px}.support{font-size:16px;color:var(--muted);margin-bottom:20px}.hero-action{font-size:clamp(25px,4vw,36px);line-height:1.5;font-weight:550;margin-top:18px}.choice{margin-top:20px;color:var(--muted);font-size:14px}.return-note{padding-top:20px;margin-top:20px;border-top:1px solid var(--line)}.return-note p{font-size:14px}.review-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.review-grid h2{margin:16px 0}.review-grid p{font-size:15px}.review-grid .stop{font-size:13px}.retained{margin:0;padding-left:1.2em;display:grid;gap:12px;font-size:15px}.review-icon{color:var(--green);height:32px;width:32px}.eyebrow{font-size:12px;color:var(--green)}
@media(max-width:740px){main{width:calc(100% - 32px);margin:24px auto}.focus-grid,.review-grid{grid-template-columns:minmax(0,1fr)}.card,.focus-card{padding:20px}.timeline{padding:0 20px}.timeline li{grid-template-columns:1fr auto;gap:8px 12px}.timeline .time{grid-column:1/-1}.section-title>span{max-width:45%;text-align:right}.flow text{font-size:26px}}
@media print{body{background:white}main{width:100%;margin:0}footer{margin-top:18px}.card,.focus-card{box-shadow:none}h1{font-size:28px}section{break-inside:avoid}}
</style>
</head>
<body>
<main class="single">
<header><div class="brand"><svg width="20" height="22" viewBox="0 0 20 22" fill="none" aria-hidden="true"><path d="M10 20V10M10 13C3 13 1 8 2 3c6 0 10 3 8 10Zm0-4c0-5 4-7 8-7 1 5-2 8-8 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>PECO · 3.0.1</div><h1>先打开一个小入口。</h1><div class="meta"><span>{{DATE}}</span><span>生成于 {{GENERATED_AT}}</span><span>展示快照</span></div></header>
<section aria-labelledby="action-title">{{SUPPORT}}<article class="card now"><p class="eyebrow">当前这一件</p><h2 id="action-title" class="task-name">{{TASK}}</h2><p class="hero-action">{{ACTION}}</p><p class="stop"><span>到这里就可以停</span>{{STOP}}</p></article><p class="choice">开始这一步，不等于必须做完整项任务。之后暂停、继续或改期，都由你选择。</p>{{RETURN_POINT}}</section>
<footer><span>Peco 效率教练</span><span>本页仅供查看，不会保存或更新任务。</span></footer>
</main>
</body>
</html>
